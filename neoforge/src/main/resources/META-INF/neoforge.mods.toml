modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/ProfessorFichte/Witcher/issues"
license = "ARR"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mods]]
modId = "witcher_rpg"
version = "${version}"
displayName = "Witcher"
displayURL = "https://modrinth.com/mod/witcher-rpg-class"
authors = "Fichte"
description = '''
Slay monsters like a Witcher! Spell Engine Add-On
'''
logoFile = "assets/witcher_rpg/icon.png"

[[dependencies.witcher_rpg]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.witcher_rpg]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_compat_version},)"
