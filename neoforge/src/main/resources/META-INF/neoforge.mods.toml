side = "BOTH"

[[dependencies.witcher_rpg]]
modId = "spell_engine"
type = "required"
versionRange = "[${spell_engine_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.witcher_rpg]]
modId = "armor_model_api"
type = "required"
versionRange = "[${armor_model_api_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.witcher_rpg]]
modId = "mrpg_lib"
